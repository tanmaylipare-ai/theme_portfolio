<script type="text/babel" data-presets="react">
const { useRef, useEffect, useState, useLayoutEffect, useImperativeHandle } = React;
gsap.registerPlugin(ScrollTrigger);

/* ----------------------------------------------------------------
   Shared motion vocabulary — every animation in this file draws
   from this small set, so the whole site reads as one deliberate
   hand rather than a pile of one-off tweaks.

   reveal   — decisive, editorial entrance for text/shapes (no bounce)
   settle   — soft deceleration for things fading/scaling into frame
   drop     — for objects with real implied mass (hanging, falling);
              used sparingly — this is the only curve allowed to overshoot
   ambient  — slow, continuous, physically idle motion
   hover    — fast, crisp, no-bounce feedback for interactive elements
------------------------------------------------------------------ */
const EASE = {
  reveal: 'power4.out',
  settle: 'expo.out',
  drop: 'elastic.out(1, 0.6)',
  ambient: 'sine.inOut',
  hover: 'power2.out'
};

/* ----------------------------------------------------------------
   Spider-web decorative SVG — abstract quarter-web, corner-anchored.
   Purely geometric (spokes + concentric arcs), no copyrighted forms.
------------------------------------------------------------------ */
const WebMark = React.forwardRef(function WebMark(
  { className = '', color = '#0B0B0C', opacity = 1, strokeWidth = 1 },
  ref
) {
  return (
    <svg
      ref={ref}
      viewBox="0 0 220 220"
      className={className}
      style={{ opacity }}
      fill="none"
    >
      <g stroke={color} strokeWidth={strokeWidth} vectorEffect="non-scaling-stroke" strokeLinecap="round">
        <path d="M0,0 L220,0" />
        <path d="M0,0 L212.5,56.9" />
        <path d="M0,0 L190.5,110" />
        <path d="M0,0 L155.6,155.6" />
        <path d="M0,0 L110,190.5" />
        <path d="M0,0 L56.9,212.5" />
        <path d="M0,0 L0,220" />
        <path d="M50,0 A50,50 0 0 1 0,50" />
        <path d="M100,0 A100,100 0 0 1 0,100" />
        <path d="M150,0 A150,150 0 0 1 0,150" />
        <path d="M200,0 A200,200 0 0 1 0,200" />
      </g>
    </svg>
  );
});

function drawWeb(svgEl, { delay = 0, duration = 1.6, stagger = 0.035 } = {}) {
  if (!svgEl) return;
  const paths = svgEl.querySelectorAll('path');
  paths.forEach((p) => {
    const len = p.getTotalLength();
    gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
  });
  gsap.to(paths, {
    strokeDashoffset: 0,
    duration,
    delay,
    stagger,
    ease: EASE.reveal
  });
}

/* Tiny spider glyph used in eyebrow labels */
function SpiderGlyph({ className = '', color = '#A6141E' }) {
  return (
    <svg viewBox="0 0 32 32" className={className} fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round">
      <ellipse cx="16" cy="17" rx="4.2" ry="5.4" fill={color} stroke="none" />
      <circle cx="16" cy="9.5" r="2.6" fill={color} stroke="none" />
      <path d="M13 14 C8 12, 4 12, 2 9" />
      <path d="M13 16 C7 16, 3 16.5, 1 17" />
      <path d="M13 19 C8 21, 5 23, 3 26" />
      <path d="M13 15 C9 10, 7 7, 5 4" />
      <path d="M19 14 C24 12, 28 12, 30 9" />
      <path d="M19 16 C25 16, 29 16.5, 31 17" />
      <path d="M19 19 C24 21, 27 23, 29 26" />
      <path d="M19 15 C23 10, 25 7, 27 4" />
    </svg>
  );
}

/* ----------------------------------------------------------------
   Custom cursor dot — subtle hover feedback only over things that
   are actually interactive, not the whole page.
------------------------------------------------------------------ */
function CursorDot() {
  const dotRef = useRef(null);
  useEffect(() => {
    const dot = dotRef.current;
    const move = (e) => {
      gsap.to(dot, { x: e.clientX, y: e.clientY, duration: 0.35, ease: EASE.hover });
    };
    const onOver = (e) => {
      if (e.target.closest('a, button, .pill, .cursor-target')) {
        gsap.to(dot, { scale: 2, duration: 0.3, ease: EASE.hover });
      }
    };
    const onOut = (e) => {
      if (e.target.closest('a, button, .pill, .cursor-target')) {
        gsap.to(dot, { scale: 1, duration: 0.3, ease: EASE.hover });
      }
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseover', onOver);
    window.addEventListener('mouseout', onOut);
    return () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('mouseout', onOut);
    };
  }, []);
  return <div/>
  /* <div ref={dotRef} className="cursor-dot hidden md:block" />; */
}

/* ----------------------------------------------------------------
   Nav
------------------------------------------------------------------ */
function Nav() {
  const navRef = useRef(null);
  useEffect(() => {
    gsap.fromTo(navRef.current, { y: -32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: EASE.reveal, delay: 0.15 });

  const links = ['Work', 'About', 'Contact'];
  return (
    <header ref={navRef} className="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-paper/70 border-b border-ink/10">

          <span className="font-display font-700 text-lg tracking-wide uppercase">Tanmay Lipare</span>
        </a>
        <nav className="hidden md:flex items-center gap-10 font-mono text-xs uppercase tracking-widest text-stone">
          {links.map((l) => (
            <a key={l} href={`#${l.toLowerCase()}`} className="underline-hover py-1 hover:text-ink transition-colors duration-300 ease-out">
              {l}
            </a>
          ))}
        </nav>
        <a
          href="#contact"
          className="hidden md:inline-flex items-center gap-2 font-mono text-xs uppercase tracking-widest border border-ink px-4 py-2 transition-all duration-300 ease-out hover:bg-ink hover:text-paper hover:-translate-y-0.5 hover:shadow-[0_10px_24px_rgba(11,11,12,0.14)]"
        >
          Let's Talk
        </a>
      </div>
    </header>

/* ----------------------------------------------------------------
   Magnetic button — restrained pull, crisp release (no bounce),
   soft lift + shadow expansion as the actual hover feedback.
------------------------------------------------------------------ */
function MagneticButton({ children, href = '#', primary = false }) {
  const btnRef = useRef(null);
  const textRef = useRef(null);
  useEffect(() => {
    const btn = btnRef.current;
    const baseShadow = '0 0px 0px rgba(11,11,12,0)';
    const hoverShadow = primary
      ? '0 16px 30px rgba(166,20,30,0.22)'
      : '0 16px 30px rgba(11,11,12,0.14)';

    const onEnter = () => {
      gsap.to(btn, { boxShadow: hoverShadow, duration: 0.3, ease: EASE.hover, overwrite: 'auto' });
    };
    const onMove = (e) => {
      const r = btn.getBoundingClientRect();
      const x = e.clientX - (r.left + r.width / 2);
      const y = e.clientY - (r.top + r.height / 2);
      // Small pull + a constant -3px lift while hovered — restrained, not "gamey" magnetism.
      gsap.to(btn, { x: x * 0.12, y: y * 0.16 - 3, duration: 0.45, ease: EASE.hover });
      gsap.to(textRef.current, { x: x * 0.06, y: y * 0.08, duration: 0.45, ease: EASE.hover });
    };
    const onLeave = () => {
      gsap.to(btn, { x: 0, y: 0, boxShadow: baseShadow, duration: 0.45, ease: EASE.hover });
      gsap.to(textRef.current, { x: 0, y: 0, duration: 0.45, ease: EASE.hover });
    };
    btn.addEventListener('mouseenter', onEnter);
    btn.addEventListener('mousemove', onMove);
    btn.addEventListener('mouseleave', onLeave);
    return () => {
      btn.removeEventListener('mouseenter', onEnter);
      btn.removeEventListener('mousemove', onMove);
      btn.removeEventListener('mouseleave', onLeave);
    };
  }, [primary]);
  return (
    <a
      ref={btnRef}
      href={href}
      style={{ boxShadow: '0 0px 0px rgba(11,11,12,0)' }}
      className={`magnetic-btn cursor-target inline-flex items-center justify-center px-8 py-4 font-mono text-xs uppercase tracking-widest transition-colors duration-300 ${
        primary
          ? 'bg-ink text-paper hover:bg-red'
          : 'border border-ink text-ink hover:border-red hover:text-red'
      }`}
    >
      <span ref={textRef} className="inline-block">{children}</span>
    </a>
  );
}

/* ----------------------------------------------------------------
   Hero — mouse-following punch-hole reveal between two real photos.
   Base layer (always visible): developer photo.
   Top layer (covers everything): superhero photo, masked with a
   soft-edged radial-gradient hole that follows the cursor. Both
   photos share one geometry (HERO_IMAGE_FRAME) so they stay aligned,
   and both live inside one wrapper (photoStackRef) so the idle
   "breathing" scale animates them as a single physical object
   instead of drifting independently.
------------------------------------------------------------------ */

// Swap these for your actual assets.
const DEVELOPER_PHOTO_SRC = '/assets/developer-photo.png';
const SUPERHERO_PHOTO_SRC = '/assets/superhero-photo.png';

// Shared frame geometry — both images MUST use the exact same classes,
// or the mask on the top layer won't line up with the photo underneath.
const HERO_IMAGE_FRAME =
  'absolute top-1/2 right-[4%] md:right-[6%] -translate-y-1/2 ' +
  'w-[72%] sm:w-[58%] md:w-[38%] lg:w-[32%] ' +
  'aspect-[4/5] object-cover rounded-sm ' +
  'shadow-[0_30px_60px_-15px_rgba(11,11,12,0.35)]';

function Hero() {
  const sectionRef = useRef(null);
  const photoStackRef = useRef(null); // wraps both photo layers — carries idle breathing scale
  const maskLayerRef = useRef(null);  // superhero layer, holds the punch-hole mask
  const contentRef = useRef(null);
  const line1Ref = useRef(null);
  const line2Ref = useRef(null);
  const line3Ref = useRef(null);
  const subRef = useRef(null);
  const ctaRef = useRef(null);
  const eyebrowRef = useRef(null);
  const scrollCueRef = useRef(null);
  const webTL = useRef(null);
  const webBR = useRef(null);
  const pos = useRef({ x: 0, y: 0 });

  useLayoutEffect(() => {
    const ctx = gsap.context((self) => {
      const tl = gsap.timeline({ defaults: { ease: EASE.reveal } });
      tl.fromTo(eyebrowRef.current, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6 }, 0.1)
        .fromTo([line1Ref.current, line2Ref.current, line3Ref.current],
          { clipPath: 'inset(0 0 100% 0)', y: 36 },
          { clipPath: 'inset(0 0 0% 0)', y: 0, duration: 0.95, stagger: 0.1 }, 0.22)
        .fromTo(subRef.current, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7 }, '-=0.5')
        .fromTo(ctaRef.current, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7 }, '-=0.55')
        // Superhero layer settles into place over the developer photo.
        .fromTo(maskLayerRef.current, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 1.2, ease: EASE.settle }, 0.3)
        // The hole opens once the cover is mostly visible — reads as
        // "cover appears, then reveals," not two things happening at once.
        .fromTo(maskLayerRef.current, { '--r': '0px' }, { '--r': '150px', duration: 1.2, ease: EASE.settle }, '-=0.6')
        .fromTo(scrollCueRef.current, { opacity: 0 }, { opacity: 1, duration: 0.7 }, '-=0.3');

      drawWeb(webTL.current, { delay: 0.55, duration: 1.6 });
      drawWeb(webBR.current, { delay: 0.8, duration: 1.6 });

      // Ambient — scroll cue and a barely-there breathing scale on the photo
      // stack, so the hero has quiet life even before anyone moves the mouse.
      const startAmbient = self.add('startAmbient', () => {
        gsap.to(scrollCueRef.current.querySelector('.dot'), {
          y: 8, duration: 1.3, ease: EASE.ambient, yoyo: true, repeat: -1
        });
        gsap.to(photoStackRef.current, {
          scale: 1.012, duration: 5, ease: EASE.ambient, yoyo: true, repeat: -1
        });
      });
      tl.call(startAmbient, null, '-=0.2');

      // Cursor repositions the hole (--mx/--my) precisely; a very subtle,
      // opposite-direction parallax on the corner webs adds depth without
      // ever touching the photo (which must stay pixel-accurate for the mask).
      const onMove = (e) => {
        const r = sectionRef.current.getBoundingClientRect();
        pos.current.x = e.clientX - r.left;
        pos.current.y = e.clientY - r.top;
        gsap.to(maskLayerRef.current, {
          '--mx': pos.current.x + 'px',
          '--my': pos.current.y + 'px',
          duration: 0.55,
          ease: EASE.hover,
          overwrite: 'auto'
        });

        const nx = pos.current.x / r.width - 0.5;
        const ny = pos.current.y / r.height - 0.5;
        gsap.to(webTL.current, { x: nx * 10, y: ny * 10, duration: 1, ease: EASE.hover, overwrite: 'auto' });
        gsap.to(webBR.current, { x: nx * -12, y: ny * -12, duration: 1, ease: EASE.hover, overwrite: 'auto' });
      };
      sectionRef.current.addEventListener('mousemove', onMove);
      return () => sectionRef.current.removeEventListener('mousemove', onMove);
    }, sectionRef);
    return () => ctx.revert();
  }, []);

  return (
    <section
      id="top"
      ref={sectionRef}
      className="relative min-h-screen w-full overflow-hidden flex items-center bg-paper noise"
    >
      {/* photo stack — base (developer) + masked cover (superhero), scaled as one unit */}
      <div id="photo-stack" ref={photoStackRef} className="absolute inset-0 pointer-events-none">
        <img src={DEVELOPER_PHOTO_SRC} alt="Tanmay Lipare" className={HERO_IMAGE_FRAME} />

        <div
          ref={maskLayerRef}
          className="absolute inset-0"
          style={{
            '--mx': '78%',
            '--my': '50%',
            '--r': '100px',
            WebkitMaskImage:
              'radial-gradient(circle at var(--mx) var(--my), transparent 0px, transparent calc(var(--r) - 55px), rgba(0,0,0,0.5) calc(var(--r) - 15px), black var(--r))',
            maskImage:
              'radial-gradient(circle at var(--mx) var(--my), transparent 0px, transparent calc(var(--r) - 55px), rgba(0,0,0,0.5) calc(var(--r) - 15px), black var(--r))',
            WebkitMaskRepeat: 'no-repeat',
            maskRepeat: 'no-repeat'
          }}
        >
          <img src={SUPERHERO_PHOTO_SRC} alt="" aria-hidden="true" className={HERO_IMAGE_FRAME} />
        </div>
      </div>

      {/* web decorations — kept quiet: low opacity, tiny parallax drift only */}
      <WebMark ref={webTL} color="#0B0B0C" opacity={0.4} className="absolute top-16 left-0 w-40 md:w-56 pointer-events-none" />
      <WebMark ref={webBR} color="#FAFAF8" opacity={0.28} className="absolute bottom-0 right-0 w-48 md:w-72 rotate-180 pointer-events-none" />

      {/* content — capped width so the headline never runs into the photo frame */}
      <div ref={contentRef} className="relative z-10 max-w-7xl mx-auto px-6 md:px-10 w-full pt-24 md:pt-16">
        <div className="max-w-[92%] sm:max-w-[74%] lg:max-w-[58%]">
          <div ref={eyebrowRef} className="flex items-center gap-2.5 mb-6 font-mono text-xs uppercase tracking-[0.25em] text-red">
            <SpiderGlyph className="w-4 h-4" color="#A6141E" />
            Developer — Est. 2021
          </div>

          <h1 className="font-display font-900 uppercase leading-[0.82] text-[15vw] sm:text-[11vw] lg:text-[7.4vw] tracking-tight">
            <span className="block overflow-hidden">
              <span ref={line1Ref} className="heading-line block">Weaving</span>
            </span>
            <span className="block overflow-hidden">
              <span ref={line2Ref} className="heading-line block text-transparent" style={{ WebkitTextStroke: '1.5px #0B0B0C' }}>Code Into</span>
            </span>
            <span className="block overflow-hidden">
              <span ref={line3Ref} className="heading-line block">Experience</span>
            </span>
          </h1>

          <div className="mt-12 md:mt-16 flex flex-col gap-8">
            <p ref={subRef} className="max-w-md text-stone text-base md:text-lg leading-relaxed">
              I design and build full-stack products - from the smallest interaction
              to the system underneath - where every thread connects.
            </p>
            <div ref={ctaRef} className="flex flex-wrap gap-4">
              <MagneticButton href="#work" primary>View Selected Work</MagneticButton>
              <MagneticButton href="#contact">Say Hello</MagneticButton>
            </div>
          </div>
        </div>
      </div>

      <div ref={scrollCueRef} className="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-0">
        <span className="font-mono text-[10px] uppercase tracking-widest text-stone">Scroll</span>
        <div className="w-px h-10 bg-ink/20 relative overflow-hidden">
          <span className="dot absolute top-0 left-0 w-px h-4 bg-red" />
        </div>
      </div>
    </section>
  );
}

/* ----------------------------------------------------------------
   HangingProfile — reusable hanging profile image on a thread.
   The entrance is owned by the PARENT's master timeline (via
   getGroupEl()), so it sequences inside one coordinated ScrollTrigger.
   This component owns its own ambient loop — a slow, heavy-feeling
   pendulum swing and a quiet shadow pulse — started by the parent
   once the whole entrance has settled.
------------------------------------------------------------------ */
const HangingProfile = React.forwardRef(function HangingProfile(
  { src, alt = 'Profile photo', size = 'clamp(14rem, 30vw, 18rem)', threadClassName = 'h-24 md:h-40' },
  ref
) {
  const groupRef = useRef(null);
  const borderRef = useRef(null);
  const gsapCtxRef = useRef(null);

  useLayoutEffect(() => {
    const ctx = gsap.context((self) => {
      // Hidden starting state — parent's timeline animates this element in.
      gsap.set(groupRef.current, { y: -800, opacity: 0, transformOrigin: 'top center' });
      gsap.set(borderRef.current, {
        boxShadow: '0 10px 26px rgba(0,0,0,0.22), 0 0 0px 0px rgba(166,20,30,0)'
      });

      // Registered (not run yet) so tweens created later are still tracked for cleanup.
      self.add('startAmbient', () => {
        // A real hanging weight on a long thread swings slowly — heavier,
        // slower motion reads as more physically believable than a fast wobble.
        gsap.to(groupRef.current, {
          rotation: 2, duration: 3.4, ease: EASE.ambient, yoyo: true, repeat: -1,
          transformOrigin: 'top center'
        });
        gsap.to(borderRef.current, {
          boxShadow: '0 10px 26px rgba(0,0,0,0.22), 0 0 34px 9px rgba(166,20,30,0.32)',
          duration: 3, ease: EASE.ambient, yoyo: true, repeat: -1
        });
      });
    }, groupRef);
    gsapCtxRef.current = ctx;
    return () => ctx.revert();
  }, []);

  useImperativeHandle(ref, () => ({
    getGroupEl: () => groupRef.current,
    startAmbient: () => {
      if (gsapCtxRef.current) gsapCtxRef.current.startAmbient();
    }
  }));

  return (
    <div className="flex justify-center md:justify-start">
      <div ref={groupRef} className="relative flex flex-col items-center">
        {/* long thin thread, longer on desktop */}
        <div className={`w-px ${threadClassName} bg-gradient-to-b from-ink/0 to-ink/40`} />

        <div className="group relative cursor-target" style={{ width: size, height: size }}>
          {/* thick circular accent border — pulsing shadow + a subtle hover scale */}

/* ----------------------------------------------------------------
   About — suspended thread portrait + web corners + reveals
------------------------------------------------------------------ */
const TECH = ['Angular', 'TypeScript','Javascript','Python','Dotnet', 'PostgreSQL','Tailwind', 'HTML', 'CSS','RestAPI'] ;

function About() {
  const sectionRef = useRef(null);
  const headingRef = useRef(null);
  const eyebrowRef = useRef(null);
  const paraRefs = useRef([]);
  const pillsRef = useRef([]);
  const webTL = useRef(null);
  const webTR = useRef(null);
  const hangingRef = useRef(null);

  /* -----------------------------------------------------------
     One orchestrated ScrollTrigger'd timeline drives the whole
     entrance in sequence, with slight overlaps rather than a rigid
     step-by-step chain. Once it fully resolves, every ambient loop
     — web sway, profile swing, frame shadow pulse, pill float —
     starts together in one beat.
  ------------------------------------------------------------ */
  useLayoutEffect(() => {
    const ctx = gsap.context((self) => {
      const webs = [webTL.current, webTR.current];
      const hangingEl = hangingRef.current ? hangingRef.current.getGroupEl() : null;

      // Responsive-friendly starting values, set synchronously so nothing flashes in.
      gsap.set(webs, { y: -100, opacity: 0 });
      gsap.set(eyebrowRef.current, { opacity: 0, x: -40, clipPath: 'inset(0 100% 0 0)' });
      gsap.set(headingRef.current, { clipPath: 'inset(0 0 100% 0)', y: 48 });
      gsap.set(paraRefs.current, { opacity: 0, rotateX: -18, y: 20, transformOrigin: 'top center' });
      gsap.set(pillsRef.current, { opacity: 0, scale: 0.5 });

      // Ambient loops, registered now (so later-created tweens still get cleaned
      // up by ctx.revert()) but not started until the entrance has fully settled.
      const startAmbient = self.add('startAmbient', () => {
        webs.forEach((el, i) => {
          gsap.to(el, {
            rotation: i === 0 ? 2.5 : -2.5,
            duration: 8 + i * 1.6,
            ease: EASE.ambient,
            yoyo: true,
            repeat: -1,
            transformOrigin: i === 0 ? '0% 0%' : '100% 0%'
          });
        });
        pillsRef.current.forEach((el, i) => {
          gsap.to(el, {
            y: -4,
            duration: 2.2 + (i % 4) * 0.3,
            ease: EASE.ambient,
            yoyo: true,
            repeat: -1,
            delay: i * 0.12
          });
        });
        if (hangingRef.current) hangingRef.current.startAmbient();
      });

      const tl = gsap.timeline({
        scrollTrigger: { trigger: sectionRef.current, start: 'top 75%' },
        defaults: { ease: EASE.reveal },
        onComplete: startAmbient
      });

      // 1. Background webs drop from above — the one moment allowed a
      //    physical overshoot, since these are meant to read as falling.
      tl.to(webs, {
        y: 0, opacity: 0.08, duration: 1.2, ease: EASE.drop, stagger: 0.15
      })
        // 2. Eyebrow slides in from the left with a clip-path reveal.
        .to(eyebrowRef.current, {
          opacity: 1, x: 0, clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'power3.out'
        }, '-=0.65')
        // 3. Heading rises from below with a clip-path reveal.
        .to(headingRef.current, {
          clipPath: 'inset(0 0% 0 0)', y: 0, duration: 1, ease: EASE.reveal
        }, '-=0.4');

      // 4. Hanging profile image drops from the ceiling, in step with the heading.
      if (hangingEl) {
        tl.to(hangingEl, {
          y: 0, opacity: 1, duration: 1.5, ease: EASE.drop
        }, '-=0.7');
      }

      tl
        // 5. Paragraphs reveal individually with a subtle 3D tilt and stagger.
        .to(paraRefs.current, {
          opacity: 1, rotateX: 0, y: 0, duration: 0.8, stagger: 0.15, ease: 'power3.out'
        }, '-=0.95')
        // 6. Technology pills scale in with stagger — a light settle, not a pop.
        .to(pillsRef.current, {
          opacity: 1, scale: 1, duration: 0.5, stagger: 0.05, ease: 'back.out(1.5)'
        }, '-=0.45');
    }, sectionRef);
    return () => ctx.revert();
  }, []);

  return (
    <section id="about" ref={sectionRef} className="relative py-28 md:py-40 bg-paperAlt overflow-hidden">
      <WebMark ref={webTL} color="#0B0B0C" opacity={0.08} className="absolute -top-4 -left-4 w-56 md:w-80" />

      <div className="max-w-7xl mx-auto px-6 md:px-10 grid md:grid-cols-2 gap-16 md:gap-24 items-start relative z-10">
        {/* left column — suspended portrait */}
        <div className="pt-6 md:pt-2">
          <HangingProfile ref={hangingRef} src={DEVELOPER_PHOTO_SRC} alt="Tanmay Lipare" />
        </div>

        {/* right column — copy */}
        <div>
          <div ref={eyebrowRef} className="flex items-center gap-2.5 mb-5 font-mono text-xs uppercase tracking-[0.25em] text-red">
            <SpiderGlyph className="w-4 h-4" color="#A6141E" />
            About
          </div>

          <h2 ref={headingRef} className="font-serifItalic italic uppercase text-4xl md:text-6xl leading-[1.02] tracking-tight mb-8">
            The developer<br />behind the threads
          </h2>

          <div className="para-3d space-y-5 max-w-xl">
            <p ref={(el) => (paraRefs.current[0] = el)} className="text-stone text-base md:text-lg leading-relaxed">
              I'm Tanmay Lipare — a developer by profession who treats every product as a
              connected system, not a pile of features. Frontend, backend,
              infrastructure: each thread has to hold weight on its own and support
              everything attached to it.
            </p>
            <p ref={(el) => (paraRefs.current[1] = el)} className="text-stone text-base md:text-lg leading-relaxed">
                I've
              learned that the best engineering is the kind nobody notices -
              it just quietly holds.
            </p>
          </div>

          <div className="mt-10 flex flex-wrap gap-3">
            {TECH.map((t, i) => (
              <span
                key={t}
                ref={(el) => (pillsRef.current[i] = el)}
                onMouseEnter={(e) => gsap.to(e.currentTarget, { scale: 1.06, duration: 0.2, ease: EASE.hover, overwrite: 'auto' })}
                onMouseLeave={(e) => gsap.to(e.currentTarget, { scale: 1, duration: 0.25, ease: EASE.hover, overwrite: 'auto' })}
                className="pill cursor-target font-mono text-xs uppercase tracking-wider px-4 py-2 border border-ink/15 bg-paper text-ink/80 transition-colors duration-200 ease-out hover:border-red hover:text-red"
              >
                {t}
              </span>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}
